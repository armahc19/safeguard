services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safeguard
      POSTGRES_USER: safeguard
      POSTGRES_PASSWORD: safeguard
    ports:
      - "5432:5432"
    volumes:
      - safeguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeguard -d safeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - safeguard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  safeguard-postgres:
  safeguard-redis:
